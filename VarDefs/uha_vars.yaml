# uha_vars.yaml — single source of truth for UHA shared variables (VARS)
# DRAFT v0 generated 2026-10-31, reviewed by Martin from VARS.h + COM_AddStreamedVariable / VAR_Get/SetVariable
# in all ASW projects + ELECON SCOM.c (RPi forward list). Review before use.
#
# Conventions
#   name          new name (physical units, no scaling suffix)
#   legacy        old VARS.h define (int16 format, kept during migration)
#   legacy_scale  old raw int16 = physical value * legacy_scale (omitted when 1)
#   type          float (default) | int32 | uint32 | bool | enum
#   producer      node that publishes the value
#   period_ms     publish period (today's COM_AddStreamedVariable value)
#   on_can: false today NOT on CAN, only forwarded ELECON -> RPi over serial
#   receivers     documentation only (who reads it today); FW stores everything
#   ELM rule      ELM.c writes power to (energy id + 10): CONS_x_WH id N -> POW_x_W id N+10 (validator checks it)

version: 0

nodes:
  IOBOARD_D: 1
  IOBOARD_U: 2
  TECHM: 3
  ELECON: 4
  RECU: 5
  EVSE: 6   # not on the bus
  ELECON_D: 7
  RPI: 15   # gateway, receive only

defaults:
  type: float
  timeout_ms: auto        # 3x period_ms, then invalid at receiver
  on_can: true

enums:
  ElHeaterState: {0: Heating, 1: TempReached, 2: NoFreePower, 3: LowSOC, 4: 48VFail, 5: TankOvertemperature,
                  6: BoardOvertemperature, 7: InvalidInputs, 8: EleconComError, 9: SwitchError, 10: BalanceSupport, 11: ComfortHeat}

