# uha_vars.yaml — single source of truth for UHA shared variables (VARS)
# Created 2026-10-31 from the old VARS.h / stream lists; direct-access layout 2026-11-14
# (UHA_COMMON/tasks/vars2_direct_access.md). Regenerate the FW tables with tools/gen_all.py.
#
# Layout (direct access): Vars2.<Group>.<Field> or Vars2.<Group>.<Subgroup>.<Field>, max 3 levels.
#   group key     CamelCase, becomes the member name in Vars2 (Vars2.GlobalEnergy)
#   vars          a group with fields, or
#   subgroups     a container of subgroups (each with `vars`); no deeper nesting
#   producer      node that publishes the values; on a group or a subgroup, never on a variable.
#                 Every group with `vars` has exactly one producer (inherited from its container).
#   struct        optional shared C type: all groups with the same `struct` get one type
#                 sVars<struct>, their field lists must be identical
#   validity      group (default): one validity for the whole group (VARS2_SetGroupValid())
#                 per_field: each field has its own validity (written by id: TEMP, ELM, SENSIRION)
#   send          periodic (default): sent every period_ms
#                 on_change: sent when value or valid changes (min 1 s apart, VARS2_ON_CHANGE_MIN_MS) and
#                 every period_ms as refresh (use 20000: auto timeout 3 x 20000 still fits u16).
#                 On a variable or a group/subgroup (inherited like producer). Flag VMF_ON_CHANGE.
#
# Conventions (variables)
#   name          VARS2 name, gives VID_<name> and the name in uha2.json (physical units, no scaling suffix)
#   field         C field name in the group struct, CamelCase + unit suffix (_pct _V _A _W _Wh _Ah _C _l
#                 _lpm _Pa _ppm _mps), no suffix for bool / enum / no unit
#   legacy        old int16 variable name; not used by the firmware, kept for UhaGatePy (uha.json).
#                 Optional: a variable without legacy is only in uha2.json (all States)
#   legacy_scale  old raw int16 = physical value * legacy_scale (omitted when 1); uha.json only
#   type          float (default) | int32 | uint32 | bool | enum
#   period_ms     publish period of the producer (VARS2 sends it by this period)
#   on_can: false NOT on CAN, only forwarded ELECON -> RPi over serial (tunnel)
#   receivers     documentation only (who reads it today); FW stores everything
#   log_s         UhaGatePy only: log period into the RPi database in s (10 or 60); missing = not logged
#   agg           UhaGatePy only: avg (default, mean over log_s) | delta (daily/total counter, the increment
#                 per interval is stored; a drop below half = reset). On an array: every element
#                 | event (one row per change into the `events` table, no log_s; for States)
#   power_w       documentation only: electrical load of a light / output in W (not used yet)
#   ELM rule      ELM.c writes power to (energy id + 10): CONS_x_WH id N -> POW_x_W id N+10 (validator checks it)

version: 0

nodes:
  IOBOARD_D: 1
  IOBOARD_U: 2
  TECHM: 3
  ELECON: 4
  RECU: 5
  EVSE: 6   # not on the bus
  ELECON_D: 7
  RPI: 15   # gateway, receive only

defaults:
  type: float
  timeout_ms: auto        # 3x period_ms, then invalid at receiver
  on_can: true

enums:
  ElHeaterState: {0: Heating, 1: TempReached, 2: NoFreePower, 3: LowSOC, 4: 48VFail, 5: TankOvertemperature,
                  6: BoardOvertemperature, 7: InvalidInputs, 8: EleconComError, 9: SwitchError, 10: BalanceSupport, 11: ComfortHeat}
  BlindCmd: {0: None, 1: Up, 2: Down, 3: Stop}   # last command to a sunscreen / blind (position unknown)

groups:

  System:   # Network / system state (ELECON SCOM)
    producer: ELECON
    vars:
      - id: 1   # bit n = node n in NMT RUN (COM_GetNetworkStatus)
        name: NETWORK_STATUS
        field: NetworkStatus
        legacy: VAR_NETWORK_STATUS
        type: uint32
        period_ms: 5000
        on_can: false
        receivers: [RPI]

