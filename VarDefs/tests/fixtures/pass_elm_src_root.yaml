# expect-warning: ELM_AddMeter(..., VAR_BAT_SOC) but BAT_SOC is not a CONS_*_WH
# expect-warning: VAR_UNKNOWN_WH is not a VID_* or legacy of any YAML variable
# expect-absent: COMMENT
# expect-absent: VID_CONS_FOO_WH
# args: --vars-h VARS_test.h --src-root src
version: 1
nodes: {N1: 1, N2: 2, RPI: 15}
defaults: {type: float, timeout_ms: auto, on_can: true}
groups:
  Energy:
    producer: N1
    vars:
      - {id: 10, name: BAT_SOC, field: Soc_pct, legacy: VAR_BAT_SOC, unit: "%", period_ms: 1000}
  Meters:
    subgroups:
      N2:
        producer: N2
        validity: per_field
        vars:
          - {id: 60, name: CONS_FOO_WH, field: FooCons_Wh, legacy: VAR_CONS_FOO_WH, unit: "Wh", period_ms: 3000}
          - {id: 70, name: POW_FOO_W, field: FooPower_W, legacy: VAR_POW_FOO_W, unit: "W", period_ms: 3000}
