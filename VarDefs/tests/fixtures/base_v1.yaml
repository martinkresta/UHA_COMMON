# baseline ("released") definition used by the *baseline* fixtures (not a test itself)
version: 1
nodes: {N1: 1, N2: 2, RPI: 15}
defaults: {type: float, timeout_ms: auto, on_can: true}
enums:
  Mode: {0: Idle, 1: Run}
groups:
  g:
    producer: N1
    vars:
      - {id: 1, name: G_POWER_W, unit: "W", period_ms: 1000}
      - {id: 2, name: G_COUNT, type: int32, period_ms: 1000}
      - {id: 3, name: G_MODE, type: enum, enum: Mode, period_ms: 1000}
      - {id: 4, name: G_OLD, period_ms: 1000}
