# full valid definition: legacy, scale, enum, array, ELM pair, per-var producer, receivers
version: 1
nodes:
  N1: 1
  N2: 2
  RPI: 15
defaults: {type: float, timeout_ms: auto, on_can: true}
enums:
  HeaterState: {0: "Off", 1: Heating, 2: 48VFail}
groups:
  energy:
    producer: N1
    vars:
      - {id: 10, name: BAT_SOC, legacy: VAR_BAT_SOC, unit: "%", period_ms: 1000, receivers: [N2, RPI]}
      - {id: 11, name: BAT_VOLTAGE_V, legacy: VAR_BAT_VOLTAGE_V10, unit: "V", legacy_scale: 10, period_ms: 1000}
      - {id: 20, name: BAT_CELL_V, count: 3, legacy: "VAR_CELL{1..3}_MV", unit: "V", legacy_scale: 1000, period_ms: 5000}
  el_meters:
    producer: N2
    vars:
      - {id: 60, name: CONS_FOO_WH, legacy: VAR_CONS_FOO_WH, unit: "Wh", period_ms: 3000}
      - {id: 70, name: POW_FOO_W, legacy: VAR_POW_FOO_W, unit: "W", period_ms: 3000, timeout_ms: 10000}
  heater:
    producer: N1
    vars:
      - {id: 80, name: HEATER_STATE, legacy: VAR_HEATER_STATE, type: enum, enum: HeaterState, period_ms: 3000, producer: N2, on_can: false}
