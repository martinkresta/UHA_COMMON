# expect: id 4 was G_OLD in base_v1.yaml, now G_OTHER
# args: --vars-h VARS_test.h --baseline base_v1.yaml
version: 1
nodes: {N1: 1, N2: 2, RPI: 15}
defaults: {type: float, timeout_ms: auto, on_can: true}
enums:
  Mode: {0: Idle, 1: Run}
groups:
  g:
    producer: N1
    vars:
      - {id: 1, name: G_POWER_W, field: GPower_W, unit: "W", period_ms: 1000}
      - {id: 2, name: G_COUNT, field: GCount, type: int32, period_ms: 1000}
      - {id: 3, name: G_MODE, field: GMode, type: enum, enum: Mode, period_ms: 1000}
      - {id: 4, name: G_OTHER, field: GOther, period_ms: 1000}
