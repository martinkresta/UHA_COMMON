# expect-absent: WARNING
version: 1
nodes: {N1: 1, N2: 2, RPI: 15}
defaults: {type: float, timeout_ms: auto, on_can: true}
enums:
  Mode: {0: Idle, 1: Run, 2: Stop}
groups:
  g:
    producer: N1
    vars:
      - {id: 1, name: ST_LIGHT, field: StLight_pct, type: uint32, unit: '%', period_ms: 1000}
      - {id: 2, name: ST_MODE, field: StMode, type: enum, enum: Mode, period_ms: 1000}
  h:
    producer: N2
    vars:
      - {id: 3, name: ST_B, field: StB, type: bool, period_ms: 1000}
commands:
  - {id: 101, name: CMD_A, target: N1, type: uint32, min: 0, max: 100, unit: '%', state: ST_LIGHT}
  - {id: 102, name: CMD_MODE, target: N1, type: enum, enum: Mode, state: ST_MODE, desc: mode}
  - {id: 199, name: CMD_SET_F, target: N1, type: float, min: -5.5, max: 12.25, state: ST_LIGHT}
  - {id: 200, name: CMD_B, target: N2, type: bool, state: ST_B}
  - {id: 201, name: CMD_I, target: N2, type: int32, min: -10, max: 10, state: ST_B}
