# expect: collides with h/H_B
version: 1
nodes: {N1: 1, N2: 2, RPI: 15}
defaults: {type: float, timeout_ms: auto, on_can: true}
groups:
  g:
    producer: N1
    vars:
      - {id: 5, name: G_A, field: GA, period_ms: 1000}
  h:
    producer: N2
    vars:
      - {id: 5, name: H_B, field: HB, period_ms: 1000}
