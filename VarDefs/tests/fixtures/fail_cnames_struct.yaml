# expect: struct name sVarsFooBar also generated by group 'foo_bar'
version: 1
nodes: {N1: 1, N2: 2, RPI: 15}
defaults: {type: float, timeout_ms: auto, on_can: true}
groups:
  foo_bar:
    producer: N1
    vars:
      - {id: 1, name: A_X, period_ms: 1000}
  FOO_BAR:
    producer: N1
    vars:
      - {id: 2, name: B_X, period_ms: 1000}
